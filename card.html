<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="shared.js"></script>
</head>
<body>
<div id="content">
  <div id="msg" class="warn hidden"></div>

  <h3>Timer</h3>
  <div id="timer" class="timer">
    <span id="clock" class="clock">0:00:00</span>
    <button id="toggle" class="mod-primary">Start</button>
  </div>
  <input id="note" type="text" maxlength="60" placeholder="Waar werk je aan? (optioneel)">

  <h3>Handmatig toevoegen</h3>
  <div class="row">
    <input id="dur" type="text" placeholder="1:30 of 1,5">
    <input id="date" type="date">
    <button id="add">Toevoegen</button>
  </div>
  <p class="muted" style="margin:2px 0 0">Gebruikt de notitie hierboven. Notaties: 1:30 · 1,5 · 1u30 · 45m</p>

  <h3>Budget</h3>
  <div class="row">
    <input id="budget" type="text" placeholder="Begrote uren, bv. 16">
    <button id="saveBudget">Opslaan</button>
  </div>

  <h3>Besteed</h3>
  <div id="summary"></div>
  <ul id="list" class="list"></ul>
</div>
<script src="card.js"></script>
</body>
</html>
